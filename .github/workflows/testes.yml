name: Testes Automatizados (Python)

on:
  push:
    branches: [ "main", "feature/central-validacao-v2", "experiment/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: windows-latest # Ou ubuntu-latest, dependendo de onde seus testes de ACL são executados

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' # Ajuste para a versão que você está usando

    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install pytest openpyxl # Adicione outras dependências do seu pyproject.toml ou requirements.txt aqui

    - name: Executar testes com pytest
      run: |
        pytest tests/ -v --tb=short
