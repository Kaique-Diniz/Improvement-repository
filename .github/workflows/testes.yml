name: Testes Automatizados (Python)

on:
  push:
    branches: [ "main", "feature/central-validacao-v2", "experiment/**" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Criar ambiente virtual
      run: |
        python -m venv .venv
        .\.venv\Scripts\python.exe --version

    - name: Instalar dependências
      run: |
        .\.venv\Scripts\python.exe -m pip install -e ".[test,web]"

    - name: Validar dependências
      run: .\.venv\Scripts\python.exe -m pip check

    - name: Validar sintaxe
      run: .\.venv\Scripts\python.exe -m compileall -q src tests

    - name: Executar testes com pytest
      run: |
        .\.venv\Scripts\python.exe -m pytest -q tests/ --tb=short
