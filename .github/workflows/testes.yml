name: Testes Automatizados (Python)

on:
  push:
    branches: [ "main", "feature/central-validacao-v2", "experiment/**", "feat/mvp-efemero-consolidado" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Criar ambiente virtual isolado
      run: |
        python -m venv .venv
        .\.venv\Scripts\python.exe --version

    - name: Instalar dependências
      run: |
        .\.venv\Scripts\python.exe -m pip install -e ".[test,web]"

    - name: Verificar dependências
      run: .\.venv\Scripts\python.exe -m pip check

    - name: Verificar sintaxe
      run: .\.venv\Scripts\python.exe -m compileall -q src tests

    - name: Repetir idempotência em processos separados
      run: |
        foreach ($tentativa in 1..3) {
          .\.venv\Scripts\python.exe -m pytest -q tests/bbz/test_edificio_win.py::test_idempotencia_de_canonico_e_xlsx tests/bbz/test_edificio_win.py::test_fontes_xlsx_distintas_preservam_hashes_reais tests/web/test_ephemeral.py::test_mesmos_bytes_mesmo_excel_diagnostico --tb=short
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }

    - name: Executar testes com pytest
      run: |
        .\.venv\Scripts\python.exe -m pytest -q tests/ --tb=short
