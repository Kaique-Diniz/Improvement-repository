[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "conversor-inadimplencia"
version = "0.2.0"
description = "Conversor Inteligente de Inadimplência — fundação e reconhecimento"
requires-python = ">=3.12"
dependencies = ["pydantic==2.13.4", "filelock==3.20.0", "pypdf==6.21.1", "openpyxl==3.1.5", "defusedxml==0.7.1"]

[project.optional-dependencies]
test = ["pytest==8.4.2", "fastapi==0.121.0", "python-multipart==0.0.22", "httpx==0.28.1", "xlrd==2.0.2", "xlwt==1.3.0"]
historico = ["xlrd==2.0.2"]
web = ["fastapi==0.121.0", "uvicorn==0.38.0", "python-multipart==0.0.22"]
web-test = ["httpx==0.28.1"]

[project.scripts]
conversor = "conversor.cli:main"
conversor-web = "conversor.web.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"conversor.web" = ["static/*", "perfis.json", "perfis_saida.json", "identidades_integracao.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers --strict-config -ra"
